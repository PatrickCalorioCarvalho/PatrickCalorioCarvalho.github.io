<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200">
  <defs>
    <linearGradient id="bgLab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#100f18"/>
      <stop offset="100%" stop-color="#1a1728"/>
    </linearGradient>
    <radialGradient id="glowLab" cx="72%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#8a63ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8a63ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1200" fill="url(#bgLab)"/>
  <rect width="1920" height="1200" fill="url(#glowLab)"/>

  <!-- server rack -->
  <g transform="translate(1180,240)">
    <rect x="0" y="0" width="420" height="440" rx="14" fill="#0d0b16" stroke="#3a3350" stroke-width="6"/>
    <g fill="#171426" stroke="#4a4166" stroke-width="2">
      <rect x="20" y="20" width="380" height="70" rx="6"/>
      <rect x="20" y="105" width="380" height="70" rx="6"/>
      <rect x="20" y="190" width="380" height="70" rx="6"/>
      <rect x="20" y="275" width="380" height="70" rx="6"/>
      <rect x="20" y="360" width="380" height="60" rx="6"/>
    </g>
    <circle cx="45" cy="55" r="7" fill="#5be27a"/>
    <circle cx="45" cy="140" r="7" fill="#5be27a"/>
    <circle cx="45" cy="225" r="7" fill="#8a63ff"/>
    <circle cx="45" cy="310" r="7" fill="#ffd54a"/>
    <circle cx="45" cy="390" r="7" fill="#5be27a"/>
  </g>

  <text x="140" y="600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="88" font-weight="700" fill="#f0eef8">HomeLab</text>
  <text x="140" y="680" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="88" font-weight="700" fill="#f0eef8">Development</text>
  <rect x="145" y="710" width="140" height="10" fill="#8a63ff"/>
  <text x="140" y="780" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" fill="#b6afc9">Proxmox, Terraform e Ansible provisionando um homelab com GPU</text>
</svg>
