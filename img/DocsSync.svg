<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200">
  <defs>
    <linearGradient id="bgDocsSync" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1420"/>
      <stop offset="100%" stop-color="#16233a"/>
    </linearGradient>
    <radialGradient id="glowDocsSync" cx="72%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#4aa8ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4aa8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1200" fill="url(#bgDocsSync)"/>
  <rect width="1920" height="1200" fill="url(#glowDocsSync)"/>

  <!-- two documents synced by a loop arrow -->
  <g transform="translate(1120,260)">
    <rect x="0" y="20" width="220" height="300" rx="14" fill="#0c1420" stroke="#3d5470" stroke-width="6"/>
    <line x1="30" y1="80" x2="190" y2="80" stroke="#4aa8ff" stroke-width="6" opacity="0.6"/>
    <line x1="30" y1="120" x2="190" y2="120" stroke="#3d5470" stroke-width="6"/>
    <line x1="30" y1="160" x2="150" y2="160" stroke="#3d5470" stroke-width="6"/>

    <rect x="340" y="20" width="220" height="300" rx="14" fill="#0c1420" stroke="#3d5470" stroke-width="6"/>
    <line x1="370" y1="80" x2="530" y2="80" stroke="#4aa8ff" stroke-width="6" opacity="0.6"/>
    <line x1="370" y1="120" x2="530" y2="120" stroke="#3d5470" stroke-width="6"/>
    <line x1="370" y1="160" x2="490" y2="160" stroke="#3d5470" stroke-width="6"/>

    <path d="M 240 100 C 280 60, 300 60, 335 95" stroke="#4aa8ff" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 335 95 l -22 -6 m 22 6 l -4 22" stroke="#4aa8ff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 335 250 C 295 290, 275 290, 240 255" stroke="#4aa8ff" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 240 255 l 22 6 m -22 -6 l 4 -22" stroke="#4aa8ff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="140" y="620" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="104" font-weight="700" fill="#eef3fa">DocsSync</text>
  <rect x="145" y="650" width="140" height="10" fill="#4aa8ff"/>
  <text x="140" y="720" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" fill="#a9bad0">Documentation as Code sincronizada automaticamente</text>
